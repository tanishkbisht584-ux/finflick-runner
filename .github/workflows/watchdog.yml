name: watchdog
# Hourly end-to-end health monitor. The checks, the self-heal and the alerting
# live in pipeline/ops.py (shared with the admin's Doctor page, which runs the
# same checks on demand with a fix button next to each). See its docstring for
# the failure map. Alerts = one open `watchdog` issue at a time (GitHub emails
# the owner) + a direct FCM push to the ops users' phones, never the public
# 'alerts' topic. Healthy runs auto-close any open watchdog issue.
# App-side failures (stale APK, expired session) are invisible from here.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # restart the pipeline
  issues: write    # raise the alarm

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: src
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: tanishkbisht584-ux/finhub  # the code is private; this repo only runs it
          token: ${{ secrets.SOURCE_TOKEN }}       # fine-grained, Contents read-only on finhub only
          persist-credentials: false
      - name: Install deps
        run: pip install --quiet -r pipeline/requirements.txt
      - name: Health check
        id: health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}  # storage self-heal (VACUUM FULL)
          # 30 Sep: see both projects (it only checked project 1 and missed the failover)
          SUPABASE_URL_2: ${{ secrets.SUPABASE_URL_2 }}
          SUPABASE_SERVICE_KEY_2: ${{ secrets.SUPABASE_SERVICE_KEY_2 }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY_2: ${{ secrets.SUPABASE_ANON_KEY_2 }}
          SUPABASE_ACCESS_TOKEN_2: ${{ secrets.SUPABASE_ACCESS_TOKEN_2 }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # deploy drift reads HEAD from the private code repo
          SOURCE_REPO: tanishkbisht584-ux/finhub
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          # expiry checks (Alert Center): read-only probes of each credential's expiry date
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: python pipeline/ops.py
      # The check never finished (checkout/install failed — usually SOURCE_TOKEN
      # expired or revoked — or ops.py crashed or timed out): ops.py writes done=1
      # as its very last act, so its absence means it could not raise its own alarm.
      # A Health check that FINISHED with problems is ops.py's job, not this step's.
      - name: Alarm when the watchdog could not run
        if: always() && steps.health.outputs.done != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list -R "$GITHUB_REPOSITORY" -l watchdog --state open --json number -q 'length')
          if [ "$open" = "0" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" -l watchdog -a "$GITHUB_REPOSITORY_OWNER"               -t "Watchdog could not run"               -b "The hourly check did not finish (checkout, install or a crash). If checkout failed, most likely SOURCE_TOKEN expired or was revoked: runner repo > Settings > Secrets > Actions. Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
